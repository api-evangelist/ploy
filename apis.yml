apis:
- aid: ploy:webhook-ingest
  name: Ploy Webhook Ingest API
  description: >-
    The only public HTTP endpoint Ploy documents. An authenticated inbound ingest
    endpoint that accepts any well-formed JSON object (up to 1 MB) from an
    external system — Clay, Stripe, Zapier, or a custom backend — stores it
    verbatim with its timestamp and source endpoint, and optionally runs a
    Ploybook with the payload injected as prompt context. Each endpoint has its
    own bearer key, shown once at creation. POST only; 202 on acceptance;
    documented 400/401/403/404/413/415/429 failures. Ploy does not retry inbound
    events and publishes no idempotency key, so senders must retry on 5xx and 429
    with backoff and dedupe on their own side.
  humanURL: https://docs.ploy.ai/webhooks
  baseURL: https://ploy.ai/api/v1
