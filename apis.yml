aid: ploy
name: Ploy
description: >-
  Ploy is an AI-powered marketing platform that turns a company's website into
  its growth engine. Founded in 2025 by former Webflow CTO Bryant Chou and
  backed by Y Combinator, Ploy deploys AI agents that build and optimize web
  pages, write copy, run technical SEO fixes, identify and enrich site visitors,
  launch ad campaigns, and track attribution across three product surfaces (Web,
  Grow, and Ads). Users activate pre-built marketing strategies called PloyBooks
  or author custom strategies that agents execute. Ploy is a SaaS product with a
  credit-based pricing model; as of this enrichment pass it exposes no public
  developer API, API reference, SDKs, or developer portal — only a product help
  center and native integrations (Google, GitHub sync, CRM, and ad platforms).
