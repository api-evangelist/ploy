aid: ploy
name: Ploy
description: >-
  Ploy is an AI-powered web marketing automation platform that turns a company's
  marketing website into a growth channel. Founded in 2025 by former Webflow CTO
  Bryant Chou, backed by Y Combinator and First Round Capital ($27M), Ploy runs
  AI agents that build and optimize Astro/Tailwind marketing sites, write copy,
  run technical SEO and answer-engine optimization, identify visiting companies
  without cookies, launch ad campaigns, and execute reusable multi-step workflows
  called Ploybooks. Its programmable surface is deliberately CLI-first rather
  than REST-first: Ploy publishes no OpenAPI and no public API reference, but it
  does ship a standalone `ploy` CLI binary (workspaces, sites, publishing,
  variables and secrets, documents, Ploybooks, databases, Code Sync, and
  design-system inspection) authenticated by workspace-scoped API tokens for
  headless CI and remote coding agents, an installable Agent Skills catalog
  (`ploy skills init`), and one public HTTP endpoint — an authenticated inbound
  webhook ingest at /api/v1/webhook/{endpointSlug} that stores arbitrary JSON and
  triggers a Ploybook.
