standards:
- id: oauth2
  conforms: true
  role: client
  evidence: >-
    "Connections use OAuth 2.0 with scoped permissions" for every third-party
    integration (Google, GitHub, Figma, HubSpot, Notion, Slack, ad platforms);
    "Ploy never stores passwords for any integration". Ploy is an OAuth CLIENT
    only — it publishes no authorization server of its own
    (/.well-known/oauth-authorization-server 404, probed 2026-08-12).
  source: https://docs.ploy.ai/integrations
- id: oidc
