deprecation:
  policy_url: null
  sunset_header: false
  note: >-
    Ploy publishes NO deprecation or sunset policy. Two breaking changes have
    already shipped in the CLI without a deprecation window — v0.2.0 moved CLI
    auth endpoints under /api/auth, and v0.3.1 renamed `ploy site init --from` to
    `--slurp` "(no alias)". The `--include-deprecated` flag on the
    `ploy design-system list-*` commands marks deprecated site components, which
    is a customer-content concept, not an API deprecation policy. No Deprecation
    pointer is emitted.
