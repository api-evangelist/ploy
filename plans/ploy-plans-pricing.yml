note: >-
  Credits are the metering unit and are consumed while Ploy is actively building
  or editing (image, code and document generation, planning, and visitor
  enrichment all draw the same balance); an idle live site consumes almost none.
  Higher credit tiers are selectable on each paid plan, and the pricing page
  offers "Talk to sales" for volumes above 80,000 credits. Self-serve plans are
  month-to-month. No public API pricing or per-request pricing is published —
  the CLI and webhook ingest surfaces are included with the workspace plan.
